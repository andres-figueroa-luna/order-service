spring.application.name=order-service
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/order_db
spring.datasource.username=devuser
spring.datasource.password=devpassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Kafka
spring.cloud.stream.defaultBinder=kafka
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.kafka.binder.auto-create-topics=true

spring.cloud.function.definition=handleStockReservedEvent;handleStockRejectedEvent;handleStockRestoredEvent

spring.cloud.stream.bindings.orderCreated-out-0.destination=orders-topic

spring.cloud.stream.bindings.orderCancelled-out-0.destination=order-cancelled-topic

spring.cloud.stream.bindings.handleStockReservedEvent-in-0.destination=stock-reserved-topic
spring.cloud.stream.bindings.handleStockReservedEvent-in-0.group=order-group

spring.cloud.stream.bindings.handleStockRejectedEvent-in-0.destination=stock-rejected-topic
spring.cloud.stream.bindings.handleStockRejectedEvent-in-0.group=order-group

spring.cloud.stream.bindings.handleStockRestoredEvent-in-0.destination=stock-restored-topic
spring.cloud.stream.bindings.handleStockRestoredEvent-in-0.group=order-group