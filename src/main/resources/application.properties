spring.application.name=order-service
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/order_db
spring.datasource.username=devuser
spring.datasource.password=devpassword
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Kafka
spring.cloud.stream.defaultBinder=kafka
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.kafka.binder.configuration.default.api.timeout.ms=3000
spring.cloud.stream.kafka.binder.auto-create-topics=false
spring.cloud.stream.kafka.binder.configuration.max.block.ms=3000
spring.cloud.stream.kafka.binder.configuration.request.timeout.ms=3000
spring.cloud.stream.kafka.binder.configuration.retries=1

spring.cloud.stream.kafka.bindings.orderCreated-out-0.producer.sync=true
spring.cloud.stream.kafka.bindings.orderCancelled-out-0.producer.sync=true

spring.cloud.function.definition=handleStockReservedEvent;handleStockRejectedEvent;handleStockRestoredEvent

spring.cloud.stream.bindings.orderCreated-out-0.destination=orders-topic

spring.cloud.stream.bindings.orderCancelled-out-0.destination=order-cancelled-topic

spring.cloud.stream.bindings.handleStockReservedEvent-in-0.destination=stock-reserved-topic
spring.cloud.stream.bindings.handleStockReservedEvent-in-0.group=order-group

spring.cloud.stream.bindings.handleStockRejectedEvent-in-0.destination=stock-rejected-topic
spring.cloud.stream.bindings.handleStockRejectedEvent-in-0.group=order-group

spring.cloud.stream.bindings.handleStockRestoredEvent-in-0.destination=stock-restored-topic
spring.cloud.stream.bindings.handleStockRestoredEvent-in-0.group=order-group

# --- Resilience4j ---
# Circuit Breaker
resilience4j.circuitbreaker.instances.kafkaPublisher.register-health-indicator=true
resilience4j.circuitbreaker.instances.kafkaPublisher.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafkaPublisher.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.kafkaPublisher.sliding-window-size=10

# Retry
resilience4j.retry.instances.kafkaPublisher.max-attempts=3
resilience4j.retry.instances.kafkaPublisher.wait-duration=500ms
resilience4j.retry.instances.kafkaPublisher.enable-exponential-backoff=true
resilience4j.retry.instances.kafkaPublisher.exponential-backoff-multiplier=2

# Health endpoints
management.endpoints.web.exposure.include=health,circuitbreakers,retries

# TimeLimiter
resilience4j.timelimiter.instances.kafkaPublisher.timeout-duration=3s
resilience4j.timelimiter.instances.kafkaPublisher.cancel-running-future=true